# Backup keepalive for the Supabase free-tier database.
#
# The primary keepalive is Vercel Cron (vercel.json). This is the second,
# independent one, deliberately at a different hour, because each has a silent
# failure mode the other does not share:
#   - Vercel Cron only runs against production deployments.
#   - GitHub disables scheduled workflows after 60 days of repository
#     inactivity. If that happens, re-enable this from the Actions tab.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     e.g. https://www.swarangan.sg
#   CRON_SECRET  the same value as the Vercel environment variable

name: Supabase keepalive

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keepalive endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::SITE_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi
          status=$(curl --silent --show-error --output response.json \
            --write-out "%{http_code}" --max-time 60 --retry 3 --retry-delay 20 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/keepalive?source=github")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Keepalive returned HTTP $status"
            exit 1
          fi
